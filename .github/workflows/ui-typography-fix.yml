name: UI typography fix
on:
  push:
    paths:
      - "ui-spacing-trigger.txt"
permissions:
  contents: write
jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Adjust hero typography
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('styles.css')
          s = p.read_text()
          s = s.replace(".eyebrow,.kicker{font:600 10px/1.4 var(--mono);letter-spacing:.08em;", ".eyebrow,.kicker{font:600 10px/1.4 var(--mono);letter-spacing:.14em;word-spacing:.12em;")
          s = s.replace(".hero h1{max-width:790px;font-family:var(--sans);font-size:clamp(4rem,6.25vw,6.8rem);font-weight:800;line-height:.91;letter-spacing:-.085em;", ".hero h1{max-width:790px;font-family:var(--sans);font-size:clamp(4rem,6.25vw,6.8rem);font-weight:800;line-height:.91;letter-spacing:-.038em;word-spacing:.015em;")
          s = s.replace(".hero-description{max-width:650px;color:#aeb5ad;margin:27px 0 26px;font-size:14px;line-height:1.75}", ".hero-description{max-width:650px;color:#aeb5ad;margin:27px 0 26px;font-size:14px;line-height:1.75;letter-spacing:.005em;word-spacing:.025em}")
          p.write_text(s)
          PY
          rm -f ui-spacing-trigger.txt
          rm -f .github/workflows/ui-typography-fix.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add styles.css ui-spacing-trigger.txt .github/workflows/ui-typography-fix.yml
          git commit -m "Improve hero character spacing" || exit 0
          git push
